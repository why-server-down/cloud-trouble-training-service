groups:
  - name: mission_validation
    interval: 5s
    rules:
      - record: mission:pod_healthy
        expr: kube_pod_status_phase{phase="Running"} == 1
      - record: mission:memory_usage_ratio
        expr: container_memory_working_set_bytes{namespace!="",pod!="",container!=""} / clamp_min(container_spec_memory_limit_bytes{namespace!="",pod!="",container!=""}, 1)
      - record: mission:cpu_usage
        expr: rate(container_cpu_usage_seconds_total{namespace!="",pod!="",container!=""}[1m])
      - record: mission:http_success_rate
        expr: sum by (path) (rate(http_requests_total{code=~"2.."}[1m])) / clamp_min(sum by (path) (rate(http_requests_total[1m])), 1)
      - record: mission:http_response_time_p95
        expr: histogram_quantile(0.95, sum by (path, le) (rate(http_request_duration_seconds_bucket[1m])))

  - name: system_metrics
    interval: 15s
    rules:
      - record: system:active_users_total
        expr: count(kube_namespace_created{namespace=~"user-.*"})
      - record: system:cluster_cpu_usage
        expr: sum(rate(container_cpu_usage_seconds_total{container!=""}[5m]))
      - record: system:cluster_memory_usage
        expr: sum(container_memory_working_set_bytes{container!=""})
