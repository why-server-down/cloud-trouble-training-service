groups:
  - name: system_alerts
    rules:
      - alert: PodStuckPending
        expr: kube_pod_status_phase{phase="Pending"} == 1 and time() - kube_pod_created > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Pod {{ $labels.pod }} is stuck in Pending
          description: Pod has remained Pending for more than five minutes in namespace {{ $labels.namespace }}.
      - alert: HighContainerCPUUsage
        expr: rate(container_cpu_usage_seconds_total{container!=""}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Container CPU usage is high
          description: Container {{ $labels.container }} CPU usage exceeded 0.8 cores.
      - alert: HighContainerMemoryUsage
        expr: container_memory_working_set_bytes{container!=""} / clamp_min(container_spec_memory_limit_bytes{container!=""}, 1) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Container memory usage is high
          description: Container {{ $labels.container }} is using more than 80 percent of its memory limit.
      - alert: HighBackendErrorRate
        expr: sum(rate(http_requests_total{code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Backend error rate is high
          description: More than 10 percent of backend HTTP requests are failing.
