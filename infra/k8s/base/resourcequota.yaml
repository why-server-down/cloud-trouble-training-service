# 애플리케이션 네임스페이스 상한 (BE-25)
#
# 사용자 네임스페이스 상한은 코드가 건다(sandbox_service._ensure_resource_quota).
# 이 파일은 애플리케이션 쪽이 클러스터를 다 먹지 않게 한다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: afterfail-quota
  namespace: afterfail
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
