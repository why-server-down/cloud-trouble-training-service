# 이 파일은 **적용하지 않는다.** 어떤 키가 필요한지만 적어 둔 목록이다 (BE-25).
#
# Secret 값을 저장소에 두지 않는 이유: 커밋된 값은 지워도 히스토리에 남는다.
# 배포에서는 아래 명령으로 만들고, 이 파일은 절대 `kubectl apply` 하지 않는다.
#
#   kubectl -n afterfail create secret generic afterfail-secrets \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://USER:PASSWORD@HOST:5432/afterfail' \
#     --from-literal=GEMINI_API_KEY='...'
#
# 관리형 DB(RDS)를 쓰면 DATABASE_URL 만 그쪽으로 바꾸면 된다. 애플리케이션은
# 어느 쪽인지 알 필요가 없다.
apiVersion: v1
kind: Secret
metadata:
  name: afterfail-secrets
  namespace: afterfail
type: Opaque
stringData:
  SECRET_KEY: "<배포 시점에 생성>"
  DATABASE_URL: "<배포 시점에 주입>"
  GEMINI_API_KEY: "<배포 시점에 주입>"
