# 백엔드 ServiceAccount 와 최소 권한 (BE-25)
#
# 백엔드는 in-cluster 에서 사용자 네임스페이스를 만들고, 훈련 워크로드와 샌드박스를
# 배치하고, 장애를 주입한다. 네임스페이스 이름이 실행 시점에 결정되므로(user-{uuid})
# RoleBinding 으로는 표현할 수 없어 ClusterRole 을 쓴다.
#
# 권한 목록은 코드가 실제로 호출하는 API 에서 뽑았다(2026-09-02).
# 넓혀야 할 일이 생기면 여기와 함께 근거를 적는다. `*` 는 쓰지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: afterfail-backend
  namespace: afterfail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: afterfail-backend
rules:
  # 사용자 네임스페이스 생성·조회·삭제 (k8s_setup)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "delete"]

  # 훈련 워크로드와 샌드박스
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["update"]          # supervisor 스크립트가 바뀌면 교체한다
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get"]             # service_misconfig 검증
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]            # 관측 컨텍스트
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # 사용자 명령 실행 경로. 이 권한이 곧 샌드박스 exec 이다.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "update", "patch", "delete"]

  # 사용자 네임스페이스에 거는 격리 장치
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["create", "get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get"]

  # 샌드박스에 붙이는 namespace-scoped Role/RoleBinding.
  # RBAC 은 자기가 가진 권한만 부여할 수 있으므로(권한 상승 방지) 위 목록이
  # 샌드박스 Role 의 상한이 된다. escalate/bind 는 주지 않는다.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: afterfail-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: afterfail-backend
subjects:
  - kind: ServiceAccount
    name: afterfail-backend
    namespace: afterfail
---
# Chaos Mesh CR 은 설치 네임스페이스에서만 다룬다(코드가 쓰는 것은 stresschaos 하나다).
# 네임스페이스가 고정이므로 ClusterRole 이 아니라 Role 로 좁힌다.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: afterfail-chaos
  namespace: chaos-mesh
rules:
  - apiGroups: ["chaos-mesh.org"]
    resources: ["stresschaos"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: afterfail-chaos
  namespace: chaos-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: afterfail-chaos
subjects:
  - kind: ServiceAccount
    name: afterfail-backend
    namespace: afterfail
