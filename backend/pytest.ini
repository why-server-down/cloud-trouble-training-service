[pytest]
testpaths = tests

# 기존 async 테스트가 @pytest.mark.asyncio 를 명시적으로 붙여 사용하므로 strict 모드를 쓴다.
# auto 로 두면 마크를 빠뜨린 async 테스트가 조용히 통과한 것처럼 보이지만,
# strict 에서는 마크 없는 async 테스트가 경고와 함께 드러난다.
asyncio_mode = strict

# 실제 클러스터가 필요한 테스트는 기본 실행에서 뺀다. 유닛 스위트는 클러스터 없이
# 어디서나 돌아야 하고(CI 포함), 클러스터 테스트는 `-m integration` 으로 따로 돌린다.
markers =
    integration: 실제 Kubernetes 클러스터가 있어야 하는 테스트
addopts = -m "not integration" --strict-markers
